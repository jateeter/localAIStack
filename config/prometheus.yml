# Prometheus scrape configuration — localAIStack
# Compatible with prom/prometheus:v2.53.4 (LTS)
#
# Scrape targets:
#   prometheus — self-scrape (metrics/health)
#   loki       — /metrics (Loki 3.4.2 exposes Prometheus-compatible metrics)
#   api        — /metrics (FastAPI Prometheus instrumentation, if enabled)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: localaistack
    environment: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki

  - job_name: api
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
    metrics_path: /metrics
