auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_lookback: 720h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 10000
  max_line_size: 256KB

compactor:
  working_directory: /loki/compactor
  # `shared_store` was a Loki 2.x compactor field and was removed in 3.x, where
  # the compactor takes its object store from the schema config and names the
  # delete store separately. This file kept the 2.x spelling while
  # docker-compose.yml pins grafana/loki:3.4.2, so Loki refused the config on
  # every boot — "field shared_store not found in type compactor.Config" — and
  # crash-looped. Nothing surfaced it because Loki is a logging sidecar, until
  # `api` (which depends_on it) started failing with "dependency failed to
  # start: container localai_loki is unhealthy" and took localAIStack's whole
  # start.sh down with it.
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
