version: 2

updates:

  # Python dependencies (API service)
  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    groups:
      langchain-ecosystem:
        patterns:
          - "langchain*"
          - "langgraph*"
      fastapi-stack:
        patterns:
          - "fastapi"
          - "uvicorn*"
          - "pydantic*"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5

  # Compose service images (docker-compose.yml at the repo root)
  #
  # This entry is why loki drifted unnoticed. The `docker` ecosystem below
  # covers /services/api — the API image's own Dockerfile base — and nothing
  # watched the root compose file, so `grafana/loki` moved 2.x -> 3.4.2 by hand
  # in one commit while `config/loki-config.yml` kept the 2.x `shared_store`
  # spelling. Loki then rejected its config on every boot and crash-looped
  # silently for weeks, until `api`'s depends_on turned it into a failed stack
  # start (#77).
  #
  # Pins are kept deliberately. Dependabot needs a resolvable version to
  # propose a bump against; `:latest` would remove the pin *and* the ability to
  # track it, which is the opposite of currency — the drift would simply stop
  # being visible in git.
  #
  # Majors are proposed as well as minors: Dependabot opens the PR, a human
  # merges it. Read the image majors closely — a major bump of an image that
  # mounts a config file is a config migration wearing a version number, which
  # is exactly what loki 2 -> 3 was here (#77). The bot moves the tag; it does
  # not move `config/loki-config.yml`.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    groups:
      observability:
        patterns:
          - "grafana/*"
          - "prom/*"
    open-pull-requests-limit: 5

  # Docker base images
  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3
