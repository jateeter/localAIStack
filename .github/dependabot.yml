version: 2

updates:

  # Python dependencies (API service)
  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    groups:
      langchain-ecosystem:
        patterns:
          - "langchain*"
          - "langgraph*"
      fastapi-stack:
        patterns:
          - "fastapi"
          - "uvicorn*"
          - "pydantic*"
    ignore:
      # Major version bumps reviewed manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5

  # Docker base images
  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    ignore:
      # The API image's Python version is pinned by the document-loader
      # dependency set, not by what is newest: unstructured==0.25.2 declares
      # Requires-Python >=3.11,<3.14, and no released version supports 3.14.
      # Dependabot has bumped this base image past that ceiling twice (#31,
      # reverting #28), and each bump breaks `docker compose build` — which
      # the RealityEngine_CI hosted regression runs, so the break lands as a
      # red universe-wide run rather than as a red build here.
      #
      # Unpin when requirements.txt moves to an `unstructured` that allows
      # 3.14; raising the Python version before then only re-breaks the build.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    open-pull-requests-limit: 3
